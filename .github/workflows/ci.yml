name: CI - Code Quality & Accessibility Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-markup-and-scripts:
    name: Validate Web Assets & Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Server Syntax
        run: |
          python -m py_compile server.py
          python -m py_compile accessmap-site/server.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON Manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('accessmap-site/manifest.json'))"
          echo "Manifest JSON is valid."

      - name: Check HTML Structure
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('accessmap-site/index.html', 'utf8');
            if (!html.includes('<!DOCTYPE html>') || !html.includes('id=\"map\"') || !html.includes('id=\"live-nav-hud\"')) {
              console.error('Critical elements missing in index.html');
              process.exit(1);
            }
            console.log('HTML critical DOM anchors validated successfully.');
          "
