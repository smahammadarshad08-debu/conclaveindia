<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AccessMap India — Redirecting to App</title>
  <meta http-equiv="refresh" content="0; url=accessmap-site/index.html">
  <link rel="canonical" href="accessmap-site/index.html">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px 24px;
      border-radius: 16px;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px 0;
      color: #38bdf8;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #0369a1;
    }
  </style>
  <script>
    window.location.replace("accessmap-site/index.html");
  </script>
</head>
<body>
  <div class="card">
    <h1>AccessMap India</h1>
    <p>Navigating you to the verified accessible mapping interface...</p>
    <a class="btn" href="accessmap-site/index.html">Launch AccessMap &rarr;</a>
  </div>
</body>
</html>
